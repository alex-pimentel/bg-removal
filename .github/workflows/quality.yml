name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  api:
    uses: alex-pimentel/agenteresolve-ci/.github/workflows/python-quality.yml@main
    with:
      working_directory: apps/api
      python_version: "3.11"
      coverage: true
      coverage_threshold: 95
      # ecdsa has no upstream fix and is unused (python-jose uses the cryptography backend).
      pip_audit_ignore: "PYSEC-2026-1325"

  worker:
    uses: alex-pimentel/agenteresolve-ci/.github/workflows/python-quality.yml@main
    with:
      working_directory: worker
      python_version: "3.11"
      coverage: true
      coverage_threshold: 95

  web:
    uses: alex-pimentel/agenteresolve-ci/.github/workflows/node-quality.yml@main
    with:
      working_directory: apps/web
      package_manager: npm
      coverage: true

  security:
    needs: [api, worker, web]
    permissions:
      contents: read
      security-events: write
    uses: alex-pimentel/agenteresolve-ci/.github/workflows/security-scan.yml@main

  docker:
    needs: [api]
    permissions:
      contents: read
      security-events: write
    uses: alex-pimentel/agenteresolve-ci/.github/workflows/docker-build-scan.yml@main
    with:
      context: apps/api
      dockerfile: apps/api/Dockerfile
      image_name: bg-removal-api

  docker-worker:
    needs: [worker]
    permissions:
      contents: read
      security-events: write
    uses: alex-pimentel/agenteresolve-ci/.github/workflows/docker-build-scan.yml@main
    with:
      context: worker
      dockerfile: worker/Dockerfile
      image_name: bg-removal-worker
