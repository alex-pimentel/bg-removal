[project]
name = "bg-removal-worker"
version = "1.0.0"
description = "Celery worker for background removal"
requires-python = ">=3.11"
dependencies = [
    "celery>=5.4.0",
    "redis>=5.1.0",
    "rembg[cpu]>=2.0.75",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["\\.venv", "tests"]

[[tool.mypy.overrides]]
module = "src.tasks.remove_bg"
disallow_untyped_decorators = false

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
show_missing = true
